<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>심리테스트 | toys</title>
  <meta name="theme-color" content="#F6F1E8">
  <link rel="stylesheet" href="shared/fonts/fonts.css">
  <style>
    :root { color-scheme: light; --bg: #F6F1E8; --paper: #FFFDF8; --ink: #24343B; --muted: #65716F; --line: #E4DCCD; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
    main { max-width: 560px; margin-inline: auto; padding: 40px 20px 56px; }
    a { color: inherit; }
    .back { color: var(--muted); text-decoration: none; font-size: 15px; }
    h1 { font-family: "Gowun Batang", serif; font-weight: 400; font-size: 34px; margin: 12px 0 24px; }
    .card { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 16px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; text-decoration: none; }
    .card:hover { border-color: var(--muted); }
    .card:focus-visible { outline: 3px solid #B46B2D; outline-offset: 2px; }
    .card img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; }
    .card h2 { font-family: "Gowun Batang", serif; font-weight: 400; font-size: 20px; margin: 0 0 4px; line-height: 1.4; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← toys</a>
    <h1>심리테스트</h1>
    <a class="card" href="clergy/">
      <img src="clergy/assets/pastor.jpg" alt="" width="96" height="96">
      <div>
        <h2>나는 목사일까, 신부일까, 스님일까?</h2>
        <p>뜻밖의 일상 상황 20개로 알아보는 나의 마음 씀씀이 · 약 4~5분</p>
      </div>
    </a>
  </main>
</body>
</html>
