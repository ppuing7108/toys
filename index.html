<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toys</title>
  <meta name="theme-color" content="#F6F1E8">
  <style>
    :root { color-scheme: light; --bg: #F6F1E8; --paper: #FFFDF8; --ink: #24343B; --muted: #65716F; --line: #E4DCCD; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
    main { max-width: 560px; margin-inline: auto; padding: 48px 20px 56px; }
    h1 { font-size: 30px; margin: 0 0 24px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a { display: block; padding: 18px 20px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
    a:hover { border-color: var(--muted); }
    a:focus-visible { outline: 3px solid #B46B2D; outline-offset: 2px; }
    strong { display: block; font-size: 18px; }
    span { color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>toys</h1>
    <ul>
      <li><a href="psychology-tests/"><strong>심리테스트</strong><span>가볍게 해 보는 성향 테스트 모음</span></a></li>
    </ul>
  </main>
</body>
</html>
